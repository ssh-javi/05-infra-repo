apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-deployment
  namespace: argo-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: go-api
        image: index.docker.io/sshjavi/go-devsecops-api:latest # 👈 Poné tu usuario de Docker Hub
        ports:
        - containerPort: 8080
